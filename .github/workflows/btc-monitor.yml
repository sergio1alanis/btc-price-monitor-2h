name: Bitcoin monitor every 2 hours

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Monitor BTC and notify
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          GMAIL_CONNECTED_ACCOUNT_ID: ${{ secrets.GMAIL_CONNECTED_ACCOUNT_ID }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
          TELEGRAM_CONNECTED_ACCOUNT_ID: ${{ secrets.TELEGRAM_CONNECTED_ACCOUNT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py
